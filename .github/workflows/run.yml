name: Internship Tracker

on:
  schedule:
    - cron: '0 23 * * 1-5'   # 6:00 PM EST, Mon–Fri
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow committing the updated seen_jobs.json ledger

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          JINA_API_KEY_FALLBACK: ${{ secrets.JINA_API_KEY_FALLBACK }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Persist seen-jobs ledger
        if: always()   # commit dedup state even when a company fetch errored
        run: |
          if [[ -n "$(git status --porcelain seen_jobs.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "chore(ledger): update seen_jobs [skip ci]"
            git push
          else
            echo "No ledger changes to commit."
          fi
